<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>La Tavola Project</title>
</head>

<body>

    <header>
        <div class="container">
            <div class="header-content">
                <div class="header-img">
                    <img src="./images/logo-light.svg" alt="logo" class="logo img-fluid">
                </div>

                <ul class="main-menu">
                    <li>Home</li>
                    <li>Menu</li>
                    <li>About</li>
                    <li>Gallery</li>
                    <li>Contact</li>
                </ul>

                <button class="header-btn">Reserve a Table</button>

                <i class="fa-solid fa-bars barsIcon"></i>
            </div>
        </div>
    </header>

    <div class="hero">
        <div class="container">
            <div class="hero-content">
                <span>Welcome to La Tavola</span>
                <h1>Authentic Italian Cuisine</h1>
                <p>Experience the finest Italian traditions, crafted with love and served with passion since 1985.</p>

                <div class="heroBtns">
                    <div class="reserveBtn">Reserve a Table</div>
                    <div class="viewBtn">View Our Menu</div>
                </div>


                <div class="bottom-arrow">
                    <i class="bi bi-arrow-down"></i>
                </div>
            </div>

        </div>
    </div>



    <script src="app.js"></script>
</body>

</html>
